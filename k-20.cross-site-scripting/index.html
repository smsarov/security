<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Comments</title>
  <style>
    body { font-family: monospace; max-width: 600px; margin: 40px auto; padding: 0 1rem; }
    textarea { width: 100%; height: 60px; font-family: monospace; }
    button { margin-right: 8px; cursor: pointer; }
    #comments div { border-bottom: 1px solid #ddd; padding: 6px 0; }
    .mode { margin-bottom: 12px; font-size: .85rem; color: #555; }
  </style>
</head>
<body>

<h2>Comments</h2>

<textarea id="text" placeholder="Leave a comment..."></textarea><br><br>
<button onclick="postComment()">Submit</button>

<br><br>
<div class="mode">
  Render mode:
  <label><input type="radio" name="mode" value="safe" checked onchange="load('safe')"> textContent (safe)</label>
  <label><input type="radio" name="mode" value="unsafe" onchange="load('unsafe')"> innerHTML (unsafe)</label>
</div>

<div id="comments"></div>

<script>
  document.cookie = "session=abc123";

  async function postComment() {
    const text = document.getElementById("text").value;
    await fetch("/comment", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    document.getElementById("text").value = "";
    load(currentMode);
  }

  let currentMode = "safe";

  async function load(mode) {
    currentMode = mode;
    const res = await fetch("/comments");
    const comments = await res.json();
    const container = document.getElementById("comments");
    container.innerHTML = "";

    for (const text of comments) {
      const div = document.createElement("div");

      if (mode === "unsafe") {
        div.innerHTML = text;
      } else {
        div.textContent = text;
      }

      container.appendChild(div);
    }
  }

  load("safe");
</script>

</body>
</html>
